version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: backtesting_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backtesting
    ports:
      - "5432:5432"
    volumes:
      - backtesting_pg_data:/var/lib/postgresql/data

volumes:
  backtesting_pg_data:
